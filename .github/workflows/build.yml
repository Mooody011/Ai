          python3 - << 'PY_EOF'
          import glob, os
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "INTERNET" not in s:
              s = s.replace("<application", '<uses-permission android:name="android.permission.INTERNET"/>\\n    <application android:usesCleartextTraffic="true"')
          s = s.replace('android:label="overchat_app"', 'android:label="3mh ai"')
          open(p, "w").write(s)

          kt_files = glob.glob("android/app/src/main/kotlin/**/MainActivity.kt", recursive=True)
          if kt_files:
              kt_path = kt_files[0]
              pkg_line = [l for l in open(kt_path).read().splitlines() if l.startswith("package ")][0]
              open(kt_path, "w").write(pkg_line + """
          import android.app.Activity
          import android.content.Intent
          import android.util.Base64
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel

          class MainActivity: FlutterActivity() {
              private var pendingResult: MethodChannel.Result? = null

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "app.3mh/picker").setMethodCallHandler { call, result ->
                      if (call.method == "pickImage") {
                          pendingResult = result
                          val intent = Intent(Intent.ACTION_GET_CONTENT).apply {
                              type = "image/*"
                              addCategory(Intent.CATEGORY_OPENABLE)
                          }
                          startActivityForResult(Intent.createChooser(intent, "اختر صورة"), 9001)
                      } else {
                          result.notImplemented()
                      }
                  }
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 9001) {
                      val res = pendingResult
                      pendingResult = null
                      if (resultCode == Activity.RESULT_OK && data?.data != null) {
                          try {
                              val uri = data.data!!
                              val bytes = contentResolver.openInputStream(uri)?.use { it.readBytes() }
                              if (bytes != null) {
                                  val b64 = Base64.encodeToString(bytes, Base64.NO_WRAP)
                                  res?.success(mapOf("base64" to b64, "name" to "picked.jpg"))
                              } else {
                                  res?.success(null)
                              }
                          } catch (e: Exception) {
                              res?.error("ERR", e.message, null)
                          }
                      } else {
                          res?.success(null)
                      }
                  }
              }
          }
          """)
          PY_EOF

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: 3mh-ai-overchat-apk
          path: build/app/outputs/flutter-apk/app-release.apk
